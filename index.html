<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>妙言 Markdown · Windows</title><link rel="stylesheet" href="/lib/layout.css"><link rel="stylesheet" href="/editor.css"></head>
<body data-view="source">
  <div id="shell">
    <aside id="notes" aria-label="文档列表"><input id="search" type="search" placeholder="搜索"><div id="list"></div></aside>
    <main id="main">
      <header id="heading"><input id="filename" class="mia-title" aria-label="文档标题"><nav id="actions" aria-label="视图和文件操作"><button id="panes"></button><button data-view="source"></button><button data-view="split"></button><button data-view="preview"></button><button id="focus"></button><button id="save" type="button">保存</button></nav></header>
      <div id="writing"><section class="source"><pre id="mirror" aria-hidden="true"></pre><textarea id="editor" spellcheck="false" aria-label="Markdown 源码" placeholder="从这里开始写…"></textarea></section><article id="preview" aria-label="Markdown 预览"></article></div>
    </main>
  </div>
  <input id="file" type="file" accept=".md,.markdown,text/markdown" multiple hidden>
  <script src="/editor.mjs" type="module"></script>
</body></html>
